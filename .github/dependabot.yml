---
# Keeps the supply chain current. GitHub Actions are pinned by commit SHA,
# so Dependabot is the mechanism that moves those pins forward safely.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait out the window in which a compromised release is usually caught.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Wait out the window in which a compromised release is usually caught.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
      runtime-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
