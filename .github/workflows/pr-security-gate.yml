---
name: PR Security & Quality Gate

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

concurrency:
  group: pr-security-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality-gate:
    name: Code Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      # The local policy entrypoint owns the complete base, documentation, and
      # security scopes; pyproject.toml contains only the base selection.
      - name: Lint with Ruff
        run: >-
          uv run --locked --no-sync python scripts/check-ruff-policy.py
          --profile all

      - name: Type check with Mypy
        run: |
          uv run --locked --no-sync mypy src --pretty
          uv run --locked --no-sync mypy src tests examples scripts \
            --disable-error-code no-untyped-def --pretty

  security-gate:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Gitleaks v8.30.0 release commit:
      # 6eaad039603a4de39fddd1cf5f727391efe9974e (the frozen local hook pin).
      # The published OCI image is pinned by digest, not by a mutable tag.
      - name: Scan clean checkout with Gitleaks
        uses: >-
          docker://ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
        with:
          args: >-
            dir . --config=.gitleaks.toml --redact --no-banner
            --log-level=error

      # Positive control for the scan above: `gitleaks dir` must still report
      # a synthetic token appended to every file a policy exception names. An
      # allowlist without `targetRules` would make it skip those files unread.
      # The token is generated per run and has entropy far above the rule's.
      - name: Prove Gitleaks scans the files its exceptions name
        shell: bash
        env:
          GITLEAKS_IMAGE: >-
            ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
        run: |
          controls=(
            .secrets.baseline
            .agents/skills/api-patterns/references/async-webhooks.md
            .agents/skills/api-patterns/references/examples.md
          )
          for path in "${controls[@]}"; do
            canary="$(mktemp -d "$RUNNER_TEMP/gitleaks-control.XXXXXX")"
            mkdir -p "$canary/$(dirname "$path")"
            cp .gitleaks.toml "$canary/"
            cp "$path" "$canary/$path"
            random="$(head -c 96 /dev/urandom | base64 -w0 | tr -dc 'A-Za-z0-9')"
            printf '\ntoken: ghp_%s\n' "${random:0:36}" >> "$canary/$path"
            chmod -R a+rX "$canary"
            status=0
            docker run --rm -v "$canary:/scan:ro" -w /scan "$GITLEAKS_IMAGE" \
              dir . --config=.gitleaks.toml --redact --no-banner \
              --log-level=error --exit-code=42 || status=$?
            if [ "$status" -ne 42 ]; then
              echo "::error::Gitleaks missed the control in $path ($status)"
              exit 1
            fi
          done

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Validate uv lock file
        run: uv lock --check

      - name: Static security analysis (Ruff flake8-bandit rules)
        run: >-
          uv run --locked --no-sync python scripts/check-ruff-policy.py
          --profile security

      - name: Audit dependency vulnerabilities
        run: >-
          uv run --locked --no-sync python
          scripts/audit_locked_dependencies.py

      # Tracked harness projections in .agents/ stay in scope; only the
      # locally generated client mirrors are excluded, as in pre-commit.
      - name: Scan secrets with detect-secrets
        run: |
          git ls-files -z -- . \
            ':(exclude).claude/**' \
            ':(exclude).codex/**' \
            ':(exclude).opencode/**' \
            ':(exclude).github/prompts/**' | \
            xargs -0 uv run --locked --no-sync \
            detect-secrets-hook --baseline .secrets.baseline

  public-api-invariants:
    name: Public API Surface Invariants
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Verify public API exports
        run: |
          uv run --locked --no-sync python - <<'PY'
          import globaldatafinance as gdf

          required_exports = [
              "FundamentalStocksDataCVM",
              "HistoricalQuotesB3",
              "ExtractionResultB3",
          ]

          missing = [
              name for name in required_exports if not hasattr(gdf, name)
          ]
          if missing:
              msg = (
                  "Invariante violada! "
                  f"Exportações ausentes no __init__.py: {missing}"
              )
              raise SystemExit(msg)

          msg = (
              "✅ Todas as exportações públicas "
              f"({required_exports}) estão presentes no pacote root."
          )
          print(msg)
          PY
