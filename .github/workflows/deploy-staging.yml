---
name: CD - Staging & Pre-release Validation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to validate (branch, tag, or SHA)"
        required: false
        default: "main"

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-staging-artifacts:
    name: Build & Check Distribution Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.git_ref || github.sha }}
          fetch-depth: 0

      # v7
      - name: Set up Python 3.12
        uses: >-
          actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      # v8.3.2
      - name: Install uv
        uses: >-
          astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Build package wheels and sdist
        run: uv build

      - name: Check package metadata with Twine
        run: uvx twine check dist/*

      # v7
      - name: Upload dist artifacts
        uses: >-
          actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: staging-dist-packages
          path: dist/
          retention-days: 7

  smoke-test-staging:
    name: Staging Functional Smoke Test
    runs-on: ubuntu-latest
    needs: build-staging-artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.git_ref || github.sha }}

      # v7
      - name: Set up Python 3.12
        uses: >-
          actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      # v8.3.2
      - name: Install uv
        uses: >-
          astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # v7
      - name: Download dist artifacts
        uses: >-
          actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: staging-dist-packages
          path: dist/

      - name: Install built package wheel in isolated environment
        run: |
          uv venv .test-venv
          source .test-venv/bin/activate
          uv pip install dist/*.whl

      - name: Run onboarding smoke test script
        run: |
          source .test-venv/bin/activate
          python - <<'PY'
          import globaldatafinance as gdf

          print('✅ GlobalDataFinance imported in clean venv:', gdf.__name__)
          PY
