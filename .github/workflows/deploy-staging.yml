---
name: CD - Staging & Pre-release Validation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to validate (branch, tag, or SHA)"
        required: false
        default: "main"

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-staging-artifacts:
    name: Build & Check Distribution Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.git_ref || github.sha }}
          fetch-depth: 0

      # v7
      - name: Set up Python 3.12
        uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      # v8.3.2
      - name: Install uv
        uses: >-
          astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Build package wheels and sdist
        run: uv build

      - name: Check package metadata with Twine
        run: uvx twine check dist/*

      # v7
      - name: Upload dist artifacts
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staging-dist-packages
          path: dist/
          retention-days: 7

  smoke-test-staging:
    name: Staging Functional Smoke Test
    runs-on: ubuntu-latest
    needs: build-staging-artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.git_ref || github.sha }}

      # v7
      - name: Set up Python 3.12
        uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      # v8.3.2
      - name: Install uv
        uses: >-
          astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # v7
      - name: Download dist artifacts
        uses: >-
          actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: staging-dist-packages
          path: dist/

      - name: Install built package wheel in isolated environment
        run: |
          uv venv .test-venv
          source .test-venv/bin/activate
          uv pip install dist/*.whl

      - name: Run onboarding smoke test script
        run: |
          source .test-venv/bin/activate
          python - <<'PY'
          import globaldatafinance as gdf

          print('✅ GlobalDataFinance imported in clean venv:', gdf.__name__)
          PY
