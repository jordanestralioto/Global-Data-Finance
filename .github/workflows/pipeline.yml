---
name: CI - Quality & Tests

on:
  workflow_call:
    inputs:
      release_tag:
        description: >-
          Release tag whose cumulative diff must pass integrity gates.
        required: true
        type: string
  pull_request:
    branches: [develop, main]
  push:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks-checkout:
    name: Gitleaks Checkout Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # Gitleaks v8.30.0 source tag object:
      # 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce (the frozen local hook pin).
      # The published OCI image is pinned by digest, not by a mutable tag.
      - name: Scan clean checkout with Gitleaks
        uses: >-
          docker://ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
        with:
          args: >-
            dir . --config=.gitleaks.toml --redact --no-banner
            --log-level=error

  quality:
    name: Lint, format, tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_VIRTUALENVS_IN_PROJECT: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Select cumulative pull request change range
        if: github.event_name == 'pull_request'
        env:
          QUALITY_GATE_HEAD: ${{ github.sha }}
        run: |
          base_tag="$(git describe --tags --abbrev=0 "${QUALITY_GATE_HEAD}^")"
          range="${base_tag}...${QUALITY_GATE_HEAD}"
          echo "QUALITY_GATE_RANGE=$range" >> "$GITHUB_ENV"

      - name: Select cumulative push change range
        if: >-
          github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000'
        env:
          QUALITY_GATE_HEAD: ${{ github.sha }}
        run: |
          base_tag="$(git describe --tags --abbrev=0 "${QUALITY_GATE_HEAD}^")"
          range="${base_tag}...${QUALITY_GATE_HEAD}"
          echo "QUALITY_GATE_RANGE=$range" >> "$GITHUB_ENV"

      - name: Select release change range
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          QUALITY_GATE_HEAD: ${{ github.sha }}
        run: |
          release_sha="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
          if [[ "$release_sha" != "$QUALITY_GATE_HEAD" ]]; then
            echo "Release tag does not identify the workflow SHA." >&2
            exit 1
          fi
          base_tag="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^")"
          range="${base_tag}...${QUALITY_GATE_HEAD}"
          echo "QUALITY_GATE_RANGE=$range" >> "$GITHUB_ENV"

      # --------------------------------------------------------------------------
      # 1. Project Integrity Checks
      # --------------------------------------------------------------------------
      - name: Validate uv lock file
        run: uv lock --check

      # --------------------------------------------------------------------------
      # 2. Security Checks
      # --------------------------------------------------------------------------
      - name: Static security analysis (Ruff flake8-bandit rules)
        run: |
          uv run --locked --no-sync python scripts/check-ruff-policy.py \
            --profile security
          echo "✅ Security analysis passed"

      - name: Check for vulnerable dependencies
        run: |
          uv run --locked --no-sync python \
            scripts/audit_locked_dependencies.py
          echo "✅ No vulnerable dependencies found"

      # --------------------------------------------------------------------------
      # 3. Code Quality & Formatting
      # --------------------------------------------------------------------------
      - name: Run Ruff policy profiles
        run: |
          uv run --locked --no-sync python scripts/check-ruff-policy.py \
            --profile all

      # The remote Ruff hooks apply safe fixes and formatting to changed files;
      # the policy hook above verifies the complete path-scoped profiles.
      - name: Run pre-commit (pre-commit stage)
        run: >-
          uv run --locked --no-sync pre-commit run --all-files
          --show-diff-on-failure

      # `--all-files` has no staged index, so diff-based hooks skip there.
      # Run them against the event range instead of treating SKIP as coverage.
      - name: Enforce changed-file integrity gates
        run: |
          if [[ -z "${QUALITY_GATE_RANGE:-}" ]]; then
            echo "SKIP: this event has no comparable Git range."
            exit 0
          fi
          app_dir=src/globaldatafinance/application
          uv run --locked --no-sync python scripts/check_diff_sanity.py \
            --range "$QUALITY_GATE_RANGE" \
            --allow-print-file scripts/check-import-cycles.py \
            --allow-print-file scripts/check-shell-syntax.py \
            --allow-print-file scripts/check-docs-contracts.py \
            --allow-print-file scripts/check-ruff-policy.py \
            --allow-print-file scripts/check_test_quality.py \
            --allow-print-file scripts/benchmark_cvm_http.py \
            --allow-print-file scripts/benchmark_cvm_full.py \
            --allow-print-file scripts/audit_locked_dependencies.py \
            --allow-print-file scripts/check_commit_msg.py \
            --allow-print-file scripts/check_release_evidence.py \
            --allow-print-file scripts/check_distributions.py \
            --allow-print-file scripts/release_acceptance.py \
            --allow-print-file \
            "$app_dir/b3_docs/extraction_result_formatter.py" \
            --allow-print-file \
            "$app_dir/cvm_docs/download_result_formatter.py" \
            --allow-print-file examples/01_quickstart_cvm.py \
            --allow-print-file examples/02_quickstart_b3.py \
            --allow-print-file examples/03_advanced_options_b3.py \
            --allow-print-file examples/04_yearly_b3.py
          uv run --locked --no-sync python scripts/check_test_integrity.py \
            --range "$QUALITY_GATE_RANGE"
          uv run --locked --no-sync python scripts/check-shell-syntax.py \
            --range "$QUALITY_GATE_RANGE"

      - name: Check structural test quality
        run: uv run --locked --no-sync python scripts/check_test_quality.py

      # The heavy pre-push contracts have dedicated steps below/above so CI
      # preserves focused type and coverage reports without duplicate runs.
      - name: Run pre-commit (pre-push stage)
        run: |
          uv run --locked --no-sync pre-commit run max-lines-per-file \
            --all-files \
            --hook-stage pre-push --show-diff-on-failure

      - name: Type check with mypy
        run: |
          uv run --locked --no-sync mypy src --pretty
          uv run --locked --no-sync mypy src tests examples scripts \
            --disable-error-code no-untyped-def --pretty

      # --------------------------------------------------------------------------
      # 4. Tests
      # --------------------------------------------------------------------------
      - name: Run deterministic tests (excluding slow and real-data tests)
        env:
          PYTHONPATH: .
        run: |
          mkdir -p .cache/release-coverage
          git rev-parse HEAD > .cache/release-coverage/environment.txt
          uv --version >> .cache/release-coverage/environment.txt
          uv run --locked --no-sync pytest \
            -m "not slow and not real_data and not perf" \
            --cov --cov-report=xml --cov-report=term-missing \
            --cov-report=json:.cache/release-coverage/product.json

      - name: Run real-validation executor coverage
        run: >-
          uv run --locked --no-sync pytest -q
          tests/tooling/test_cotahist_oracle.py
          tests/tooling/test_file_digests.py
          tests/tooling/test_cvm_archive_oracle.py
          tests/tooling/test_cvm_catalog.py
          tests/tooling/test_real_validation.py
          tests/tooling/test_real_validation_b3.py
          tests/tooling/test_real_validation_cases.py
          tests/tooling/test_real_validation_cvm.py
          tests/tooling/test_real_validation_cvm_integration.py
          tests/tooling/test_real_validation_matrix.py
          tests/tooling/test_real_validation_process.py
          tests/tooling/test_real_validation_report.py
          tests/tooling/test_real_validation_resume.py
          tests/tooling/test_real_validation_runner.py
          tests/tooling/test_real_validation_types.py
          tests/tooling/test_real_validation_utils.py
          --cov=scripts.cotahist_oracle
          --cov=scripts.file_digests
          --cov=scripts.cvm_archive_oracle
          --cov=scripts.cvm_catalog
          --cov=scripts.real_validation
          --cov=scripts.real_validation_b3
          --cov=scripts.real_validation_cases
          --cov=scripts.real_validation_cvm
          --cov=scripts.real_validation_matrix
          --cov=scripts.real_validation_report
          --cov=scripts.real_validation_resume
          --cov=scripts.real_validation_runner
          --cov=scripts.real_validation_types
          --cov=scripts.real_validation_utils
          --cov-report=term-missing
          --cov-report=json:.cache/release-coverage/executor.json
          --cov-fail-under=85

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          name: Python ${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: false

      - name: Upload coverage report (artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            coverage.xml
            .cache/release-coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  native-regressions:
    name: Native regressions (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        env:
          NATIVE_PYTHON: ${{ matrix.python }}
        run: uv sync --locked --all-extras --dev --python "$NATIVE_PYTHON"
      - name: Record native environment
        run: |
          mkdir -p .cache/release-native
          uv --version > .cache/release-native/environment.txt
          git rev-parse HEAD >> .cache/release-native/environment.txt
          uv run --locked --no-sync python -VV \
            >> .cache/release-native/environment.txt
      - name: Run required native behaviors
        run: |
          cvm_tests=tests/brazil/cvm/fundamental_stocks_data
          b3_tests=tests/brazil/b3_data/historical_quotes
          uv run --locked --no-sync pytest \
            -p tests.support.release_evidence --release-native \
            --release-evidence=.cache/release-native/results.json \
            --junitxml=.cache/release-native/junit.xml --no-cov \
            tests/core/test_archive_safety.py \
            tests/core/test_logging_redaction.py \
            tests/core/utils/test_path_safety.py \
            tests/macro_infra/test_publication_platforms.py \
            tests/macro_infra/test_publication_process_identity.py \
            tests/macro_infra/test_publication_crashes.py \
            tests/macro_infra/test_requests_adapter.py \
            tests/macro_infra/test_http_safety.py \
            "$cvm_tests/infra/adapters/test_http_retry.py" \
            "$cvm_tests/integration/test_destination_io_platforms.py" \
            "$cvm_tests/integration/test_transaction_recovery.py" \
            "$cvm_tests/integration/test_cvm_log_redaction.py" \
            "$b3_tests/parquet_writer/test_writer_lifecycle.py" \
            "$b3_tests/extraction_service/test_source_result_validation.py" \
            tests/application/b3_docs/test_release_regressions.py \
            tests/application/b3_docs/test_spawn_entrypoint.py
          git diff --exit-code
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: native-${{ matrix.os }}-py${{ matrix.python }}
          path: .cache/release-native/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publication-fault-campaign:
    name: Publication failure campaign (shard ${{ matrix.shard }})
    if: inputs.release_tag != '' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      GDF_PUBLICATION_SHARD: ${{ matrix.shard }}
      GDF_PUBLICATION_SHARDS: "8"
      GDF_PUBLICATION_REPORT_DIR: .cache/publication-campaign/reports
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev --python 3.13
      - name: Record campaign environment
        run: |
          mkdir -p .cache/publication-campaign
          uv --version > .cache/publication-campaign/environment.txt
          git rev-parse HEAD >> .cache/publication-campaign/environment.txt
      - name: Execute every assigned fault case
        run: |
          uv run --locked --no-sync pytest \
            tests/macro_infra/test_publication_fault_campaign.py \
            -m 'integration and slow' --no-cov \
            --junitxml=.cache/publication-campaign/junit.xml
          git diff --exit-code
      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: publication-campaign-${{ matrix.shard }}
          path: .cache/publication-campaign/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-publication-campaign:
    name: Verify complete failure campaign
    needs: publication-fault-campaign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev --python 3.13
      - name: Download all campaign shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: publication-campaign-*
          path: .cache/campaign-evidence
      - name: Reject missing or incomplete campaign evidence
        run: >-
          uv run --locked --no-sync python scripts/check_release_evidence.py
          .cache/campaign-evidence --shards 8
