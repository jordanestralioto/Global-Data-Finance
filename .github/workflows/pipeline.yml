---
name: CI - Quality & Tests

on:
  workflow_call:
    inputs:
      release_tag:
        description: >-
          Release tag whose cumulative diff must pass integrity gates.
        required: true
        type: string
  pull_request:
    branches: [develop, main]
  push:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks-checkout:
    name: Gitleaks Checkout Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # Gitleaks v8.30.0 source tag object:
      # 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce (the frozen local hook pin).
      # The published OCI image is pinned by digest, not by a mutable tag.
      - name: Scan clean checkout with Gitleaks
        uses: >-
          docker://ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
        with:
          args: >-
            dir . --config=.gitleaks.toml --redact --no-banner
            --log-level=error

  quality:
    name: Lint, format, tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_VIRTUALENVS_IN_PROJECT: true
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      # v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      # v8.3.2
      - name: Install uv
        uses: >-
          astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Select cumulative pull request change range
        if: github.event_name == 'pull_request'
        env:
          QUALITY_GATE_HEAD: ${{ github.sha }}
        run: |
          base_tag="$(git describe --tags --abbrev=0 "${QUALITY_GATE_HEAD}^")"
          range="${base_tag}...${QUALITY_GATE_HEAD}"
          echo "QUALITY_GATE_RANGE=$range" >> "$GITHUB_ENV"

      - name: Select cumulative push change range
        if: >-
          github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000'
        env:
          QUALITY_GATE_HEAD: ${{ github.sha }}
        run: |
          base_tag="$(git describe --tags --abbrev=0 "${QUALITY_GATE_HEAD}^")"
          range="${base_tag}...${QUALITY_GATE_HEAD}"
          echo "QUALITY_GATE_RANGE=$range" >> "$GITHUB_ENV"

      - name: Select release change range
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          QUALITY_GATE_HEAD: ${{ github.sha }}
        run: |
          release_sha="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
          if [[ "$release_sha" != "$QUALITY_GATE_HEAD" ]]; then
            echo "Release tag does not identify the workflow SHA." >&2
            exit 1
          fi
          base_tag="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^")"
          range="${base_tag}...${QUALITY_GATE_HEAD}"
          echo "QUALITY_GATE_RANGE=$range" >> "$GITHUB_ENV"

      # --------------------------------------------------------------------------
      # 1. Project Integrity Checks
      # --------------------------------------------------------------------------
      - name: Validate uv lock file
        run: uv lock --check

      # --------------------------------------------------------------------------
      # 2. Security Checks
      # --------------------------------------------------------------------------
      - name: Static security analysis (Ruff flake8-bandit rules)
        run: |
          uv run --locked --no-sync python scripts/check-ruff-policy.py \
            --profile security
          echo "✅ Security analysis passed"

      - name: Check for vulnerable dependencies
        run: |
          uv run --locked --no-sync python \
            scripts/audit_locked_dependencies.py
          echo "✅ No vulnerable dependencies found"

      # --------------------------------------------------------------------------
      # 3. Code Quality & Formatting
      # --------------------------------------------------------------------------
      - name: Run Ruff policy profiles
        run: |
          uv run --locked --no-sync python scripts/check-ruff-policy.py \
            --profile all

      # The remote Ruff hooks apply safe fixes and formatting to changed files;
      # the policy hook above verifies the complete path-scoped profiles.
      - name: Run pre-commit (pre-commit stage)
        run: >-
          uv run --locked --no-sync pre-commit run --all-files
          --show-diff-on-failure

      # `--all-files` has no staged index, so diff-based hooks skip there.
      # Run them against the event range instead of treating SKIP as coverage.
      - name: Enforce changed-file integrity gates
        run: |
          if [[ -z "${QUALITY_GATE_RANGE:-}" ]]; then
            echo "SKIP: this event has no comparable Git range."
            exit 0
          fi
          app_dir=src/globaldatafinance/application
          uv run --locked --no-sync python scripts/check_diff_sanity.py \
            --range "$QUALITY_GATE_RANGE" \
            --allow-print-file scripts/check-import-cycles.py \
            --allow-print-file scripts/check-shell-syntax.py \
            --allow-print-file scripts/check-docs-contracts.py \
            --allow-print-file scripts/check-ruff-policy.py \
            --allow-print-file scripts/check_test_quality.py \
            --allow-print-file scripts/benchmark_cvm_http.py \
            --allow-print-file scripts/benchmark_cvm_full.py \
            --allow-print-file scripts/audit_locked_dependencies.py \
            --allow-print-file scripts/check_commit_msg.py \
            --allow-print-file \
            "$app_dir/b3_docs/extraction_result_formatter.py" \
            --allow-print-file \
            "$app_dir/cvm_docs/download_result_formatter.py" \
            --allow-print-file examples/01_quickstart_cvm.py \
            --allow-print-file examples/02_quickstart_b3.py \
            --allow-print-file examples/03_advanced_options_b3.py
          uv run --locked --no-sync python scripts/check_test_integrity.py \
            --range "$QUALITY_GATE_RANGE"
          uv run --locked --no-sync python scripts/check-shell-syntax.py \
            --range "$QUALITY_GATE_RANGE"

      - name: Check structural test quality
        run: uv run --locked --no-sync python scripts/check_test_quality.py

      # The heavy pre-push contracts have dedicated steps below/above so CI
      # preserves focused type and coverage reports without duplicate runs.
      - name: Run pre-commit (pre-push stage)
        run: |
          uv run --locked --no-sync pre-commit run max-lines-per-file \
            --all-files \
            --hook-stage pre-push --show-diff-on-failure

      - name: Type check with mypy
        run: |
          uv run --locked --no-sync mypy src --pretty
          uv run --locked --no-sync mypy src tests examples scripts \
            --disable-error-code no-untyped-def --pretty

      # --------------------------------------------------------------------------
      # 4. Tests
      # --------------------------------------------------------------------------
      - name: Run deterministic tests (excluding slow and real-data tests)
        env:
          PYTHONPATH: .
        run: |
          uv run --locked --no-sync pytest \
            -m "not slow and not real_data and not perf" \
            --cov --cov-report=xml --cov-report=term-missing

      - name: Run real-validation executor coverage
        run: >-
          uv run --locked --no-sync pytest -q
          tests/tooling/test_cotahist_oracle.py
          tests/tooling/test_real_validation.py
          tests/tooling/test_real_validation_b3.py
          tests/tooling/test_real_validation_cases.py
          tests/tooling/test_real_validation_cvm.py
          tests/tooling/test_real_validation_matrix.py
          tests/tooling/test_real_validation_process.py
          tests/tooling/test_real_validation_report.py
          tests/tooling/test_real_validation_resume.py
          tests/tooling/test_real_validation_runner.py
          tests/tooling/test_real_validation_types.py
          tests/tooling/test_real_validation_utils.py
          --cov=scripts.cotahist_oracle
          --cov=scripts.real_validation
          --cov=scripts.real_validation_b3
          --cov=scripts.real_validation_cases
          --cov=scripts.real_validation_cvm
          --cov=scripts.real_validation_matrix
          --cov=scripts.real_validation_report
          --cov=scripts.real_validation_resume
          --cov=scripts.real_validation_runner
          --cov=scripts.real_validation_types
          --cov=scripts.real_validation_utils
          --cov-report=term-missing
          --cov-fail-under=85

      # v7
      - name: Upload coverage to Codecov
        uses: >-
          codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: ./coverage.xml
          flags: unittests
          name: Python ${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: false

      # v7
      - name: Upload coverage report (artifact)
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
