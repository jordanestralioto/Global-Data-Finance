---
name: CD - Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Security Scan before Publishing
  # --------------------------------------------------------------------------
  security-scan:
    name: Security scan before release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      # v7
      - name: Set up Python
        uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      # v8.3.2
      - name: Install uv
        uses: >-
          astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Static security analysis (Ruff flake8-bandit rules)
        run: |
          uv run --locked --no-sync python scripts/check-ruff-policy.py \
            --profile security
          echo "✅ Security analysis passed"

      - name: Check for vulnerable dependencies
        run: |
          uv run --locked --no-sync python \
            scripts/audit_locked_dependencies.py
          echo "✅ No vulnerable dependencies in release"

  # --------------------------------------------------------------------------
  # Build and Publish
  # --------------------------------------------------------------------------
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: security-scan  # Only publish if security checks pass
    permissions:
      contents: read
      id-token: write  # Required for PyPI trusted publishing
    environment:
      name: release
      url: https://pypi.org/project/globaldatafinance/
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      # v7
      - name: Set up Python
        uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      # v8.3.2
      - name: Install uv
        uses: >-
          astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Build package
        run: uv build

      - name: Check package distribution
        run: uvx twine check dist/*

      # release/v1
      - name: Publish to PyPI using Trusted Publishers
        uses: >-
          pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          print-hash: true
          verbose: true

      # v7
      - name: Upload build artifacts
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-packages
          path: dist/
          retention-days: 30
