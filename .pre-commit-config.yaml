# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Hook stages
# -----------
#   pre-commit : fast local integrity and staged-diff checks
#   commit-msg : Conventional Commits validation
#   pre-push   : full type, test and dependency checks before publishing
#
# Bootstrap once with `uv sync --locked --all-extras --dev`, then install every
# stage with: `uv run --locked --no-sync pre-commit install --install-hooks`,
# followed by the validator that checks every ref of a push:
# `uv run --locked --no-sync python scripts/check_push_snapshot.py --install`.
---
minimum_pre_commit_version: "4.3.0"

default_install_hook_types: [pre-commit, commit-msg, pre-push]
# Without this, every hook that omits `stages` would also re-run on push.
# It does not override stages a remote manifest declares, so those hooks pin
# `stages` explicitly below.
default_stages: [pre-commit]

# No `default_language_version` on purpose. Pinning `python3.12` here made
# every hook env depend on that exact interpreter being on PATH -- which the
# CI matrix (3.12/3.13/3.14) only satisfies by accident, because the current
# ubuntu-latest image happens to ship 3.12 as its system Python. When that
# image moves on, the pin would break every job at once. These hooks are
# standalone tools (ruff, yamllint, codespell, mdformat); they are not the
# code under test, and any interpreter meeting requires-python runs them
# identically. The project's own Python is pinned where it matters, in
# [project] requires-python and the CI matrix.

# `.agents/` is tracked so clones carry the portable validators, while the
# central-skills project remains the only owner of generated harness content.
# Auto-fixers and lexical hooks exclude it locally; read-only validators and
# secret scanners keep inspecting it. The client mirrors below are generated
# locally and ignored by Git; Gitleaks still scans anything force-added.
exclude: |
  (?x)^(
    \.claude/|
    \.codex/|
    \.opencode/|
    \.github/prompts/
  )

repos:
  # --------------------------------------------------------------------------
  # 0. Commit Message Validation (Conventional Commits - simplified)
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: validate-commit-msg
        name: validate-commit-msg
        entry: bash .agents/scripts/validate-commit-msg.sh
        language: system
        stages: [commit-msg]

      # Supplement the shared hook's advertised length and period rules.
      - id: validate-commit-msg-policy
        name: validate-commit-msg-policy
        entry: uv run --locked --no-sync python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]

      - id: check-harness-sync
        name: check-harness-sync
        # Generated AI-client links are not present in a clean checkout and
        # are maintained deliberately, not as a code-commit quality gate.
        entry: harness-sync --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: validate-agents-md
        name: validate-agents-md
        entry: >-
          uv run --locked --no-sync python
          .agents/skills/agents-md-author/scripts/validate_agents_md.py
        language: system
        files: ^AGENTS\.md$
        pass_filenames: false
        stages: [pre-commit]

      - id: uv-lock-check
        name: uv-lock-check
        # `uv lock --check` is read-only. Do not replace it with `uv lock` or
        # `uv sync`: those can alter tracked resolution or the environment.
        # A pyproject.toml change that alters the declared dependencies makes
        # it build the project metadata with hatchling and hatch-vcs; without
        # them in the uv cache it needs the package index, and offline it fails
        # closed. Edits that keep the dependencies, such as the description,
        # did not need them with uv 0.13.7.
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: lockfile-sync
        name: lockfile-sync
        entry: >-
          uv run --locked --no-sync python
          scripts/check_lockfile_sync.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: diff-sanity
        name: diff-sanity
        entry: >-
          uv run --locked --no-sync python
          scripts/check_diff_sanity.py
        args:
          - --allow-print-file
          - scripts/check-import-cycles.py
          - --allow-print-file
          - scripts/check-shell-syntax.py
          - --allow-print-file
          - scripts/check-docs-contracts.py
          - --allow-print-file
          - scripts/check-ruff-policy.py
          - --allow-print-file
          - scripts/check_test_quality.py
          - --allow-print-file
          - src/globaldatafinance/application/b3_docs/extraction_result_formatter.py
          - --allow-print-file
          - src/globaldatafinance/application/cvm_docs/download_result_formatter.py
          - --allow-print-file
          - examples/01_quickstart_cvm.py
          - --allow-print-file
          - examples/02_quickstart_b3.py
          - --allow-print-file
          - examples/03_advanced_options_b3.py
          - --allow-print-file
          - examples/04_yearly_b3.py
          # These benchmark CLIs intentionally emit their result reports.
          - --allow-print-file
          - scripts/benchmark_cvm_http.py
          - --allow-print-file
          - scripts/benchmark_cvm_full.py
          # Gate CLIs intentionally print their validation results.
          - --allow-print-file
          - scripts/audit_locked_dependencies.py
          - --allow-print-file
          - scripts/check_commit_msg.py
          - --allow-print-file
          - scripts/check_release_evidence.py
          - --allow-print-file
          - scripts/check_distributions.py
          - --allow-print-file
          - scripts/release_acceptance.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: test-integrity
        name: test-integrity
        entry: >-
          uv run --locked --no-sync python
          scripts/check_test_integrity.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Pre-push hooks inspect the checkout, not the pushed objects, and
      # pre-commit exposes only the first pushed ref. The validator installed
      # by `check_push_snapshot.py --install` runs first with every ref of
      # the push and refuses any that publishes a commit other than the
      # checkout. This guard requires that validator, checks the first ref,
      # and requires a clean checkout before the expensive hooks run. Manual
      # runs report SKIP and cover the working tree. Incremental pushes stash
      # unstaged tracked edits first, so this guard sees them only when the
      # push includes a root commit. Both checks judge which commits are new
      # by the local remote-tracking refs.
      - id: push-snapshot
        name: push-snapshot
        entry: >-
          uv run --locked --no-sync python
          scripts/check_push_snapshot.py
        language: system
        pass_filenames: false
        always_run: true
        fail_fast: true
        stages: [pre-push]

      - id: test-quality
        name: test-quality
        entry: >-
          uv run --locked --no-sync python
          scripts/check_test_quality.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: shell-syntax
        name: shell-syntax
        entry: uv run --locked --no-sync python scripts/check-shell-syntax.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # --------------------------------------------------------------------------
  # 1. Basic File Checks
  # --------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    # frozen: v6.0.0
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # pragma: allowlist secret
    hooks:
      # These manifests also declare pre-push; fixers must not edit the
      # checkout while a push is being validated.
      - id: trailing-whitespace
        stages: [pre-commit]
        exclude: |
          (?x)^(
            \.agents/|
            \.claude/|
            \.codex/|
            \.opencode/|
            \.github/prompts/
          )
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: |
          (?x)^(
            \.agents/|
            \.claude/|
            \.codex/|
            \.opencode/|
            \.github/prompts/
          )
      - id: mixed-line-ending
        exclude: |
          (?x)^(
            \.agents/|
            \.claude/|
            \.codex/|
            \.opencode/|
            \.github/prompts/
          )
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-ast
      - id: check-added-large-files
        args: ["--maxkb=500"]
        stages: [pre-commit]
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]
      - id: check-symlinks
      - id: destroyed-symlinks
        stages: [pre-commit]
      - id: forbid-submodules
      - id: name-tests-test
        args: ["--pytest-test-first"]
        # Shared builders are import-only test support, not pytest modules.
        exclude: ^tests/support/

  # --------------------------------------------------------------------------
  # 3. Security Checks
  # --------------------------------------------------------------------------
  # Static security analysis is handled by the explicit Ruff security profile
  # below; the base configuration intentionally does not enable `S` globally.

  # Secret Detection: detect-secrets (baseline-driven, entropy + plugins)
  # Tools that CI also runs from uv.lock (detect-secrets, Ruff, mdformat) run
  # from that same locked environment here, so hook and CI versions cannot
  # drift apart and no unpinned transitive dependency is resolved for them.
  - repo: local
    hooks:
      - id: detect-secrets
        name: detect-secrets
        entry: uv run --locked --no-sync detect-secrets-hook
        language: system
        args:
          - "--baseline"
          - ".secrets.baseline"
          # Audited false positives cover SHA-256 benchmark metadata, with
          # baseline entries bound to each report file and digest.
          # SHA-256 patch bindings are integrity metadata, not credentials.
          - "--exclude-lines"
          - '"diff_sha256":\s*"[0-9a-f]{64}"'
        exclude: ^(package\.lock|\.secrets\.baseline)

  # Secret Detection: gitleaks (provider-specific token patterns)
  - repo: https://github.com/gitleaks/gitleaks
    # frozen: v8.30.0 release commit, not the annotated tag object that
    # `git rev-parse v8.30.0` returns.
    rev: 6eaad039603a4de39fddd1cf5f727391efe9974e  # pragma: allowlist secret
    hooks:
      - id: gitleaks
        args: [--redact, --config=.gitleaks.toml]
        pass_filenames: false
        always_run: true

  # CI/CD supply-chain audit of GitHub Actions workflows
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    # v1.29.0
    rev: 451b56af716f9f0d0c2b816503a3fd0cf8b036fa  # pragma: allowlist secret
    hooks:
      - id: zizmor

  # --------------------------------------------------------------------------
  # 4. Formatting & Linting
  # --------------------------------------------------------------------------
  # Ruff check/format enforce base rules on changed Python files with the
  # uv-locked Ruff that CI runs. Automatic fixes stop at import ordering and
  # formatting; every other finding fails for review instead of rewriting
  # code before it is staged.
  # The policy hook below owns the complete, path-scoped base, docs, and
  # security profiles so CI and local hooks share one auditable entrypoint.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: uv run --locked --no-sync ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        args: [--fix, --exit-non-zero-on-fix, --fixable=I]
        exclude: |
          (?x)^(
            \.agents/|
            \.claude/|
            \.codex/|
            \.opencode/|
            \.github/prompts/
          )
      - id: ruff-format
        name: ruff-format
        entry: uv run --locked --no-sync ruff format --force-exclude
        language: system
        # Ruff 0.17 also formats Markdown code blocks; keep it on Python.
        types_or: [python, pyi, jupyter]
        require_serial: true
        exclude: |
          (?x)^(
            \.agents/|
            \.claude/|
            \.codex/|
            \.opencode/|
            \.github/prompts/
          )

      - id: ruff-policy
        name: ruff-policy
        entry: >-
          uv run --locked --no-sync python scripts/check-ruff-policy.py
          --profile all
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

  - repo: local
    hooks:
      - id: mdformat
        name: mdformat
        # mdformat loads every installed plugin; uv.lock pins mdformat-gfm and
        # its transitive dependencies.
        entry: uv run --locked --no-sync mdformat
        language: system
        types: [markdown]
        # `--number` keeps 1./2./3. numbering instead of collapsing every
        # ordered-list item to "1.", which reads badly in raw Markdown.
        args: ["--number"]
        # docs/ is built and strictly validated by MkDocs Material; mdformat
        # does not support Python-Markdown admonitions (!!!) and would corrupt
        # 4-space callout indentations.
        # Canonical source lives in the installed central distribution;
        # .agents/ is a public, tracked projection; .claude/, .codex/,
        # .opencode/ and .github/prompts/ are generated mirrors. The global
        # exclusion covers only the mirrors; this local guard also keeps the
        # formatter off the tracked projection.
        exclude: |
          (?x)^(
            docs/|
            \.agents/|
            \.claude/|
            \.codex/|
            \.opencode/|
            \.github/prompts/|
            openspec/
          )

  - repo: https://github.com/adrienverge/yamllint
    # v1.38.0
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # pragma: allowlist secret
    hooks:
      - id: yamllint
        args: ["--strict"]

  - repo: https://github.com/rhysd/actionlint
    # v1.7.12
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # pragma: allowlist secret
    hooks:
      - id: actionlint

  - repo: https://github.com/codespell-project/codespell
    # v2.4.3
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # pragma: allowlist secret
    hooks:
      - id: codespell
        args: ["--ignore-words=.codespellignore"]
        files: ^(?:src|tests|scripts|examples)/.*\.(?:py|pyi|pyw|sh|bash)$
        exclude: |
          (?x)^(
            \.agents/|
            \.claude/|
            \.codex/|
            \.opencode/|
            \.github/prompts/|
            uv\.lock$|
            \.secrets\.baseline$
          )

  # --------------------------------------------------------------------------
  # 4.1. Import Graph & Documentation Contracts
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: check-docs-contracts
        name: check-docs-contracts
        entry: uv run --locked --no-sync python scripts/check-docs-contracts.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: import-cycles
        name: import-cycles
        entry: uv run --locked --no-sync python scripts/check-import-cycles.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      # Layer contracts live in [tool.importlinter] in pyproject.toml.
      - id: import-linter
        name: import-linter
        entry: uv run --locked --no-sync lint-imports
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

  # --------------------------------------------------------------------------
  # 5. Type Checking
  # --------------------------------------------------------------------------
  # Runs inside the uv environment so mypy actually sees pydantic, pandas,
  # pyarrow and httpx types -- a hook-isolated mypy would silently treat every
  # third-party import as `Any`.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --locked --no-sync mypy src
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: mypy-supporting
        name: mypy-supporting
        entry: >-
          uv run --locked --no-sync mypy src tests examples scripts
          --disable-error-code no-untyped-def
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # --------------------------------------------------------------------------
  # 6. Full local checks (pre-push only)
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: max-lines-per-file
        name: max-lines-per-file
        entry: >-
          uv run --locked --no-sync python
          .agents/scripts/check-max-lines.py
        args: [src, tests, scripts, examples]
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      # Same selection as the CI `quality` job. Bare `--cov` picks up source
      # and the fail_under floor from [tool.coverage.*] in pyproject.toml,
      # so the gate is defined in exactly one place.
      - id: pytest-unit
        name: pytest-unit
        entry: >-
          uv run --locked --no-sync pytest -q
          -m "not slow and not real_data and not perf" --cov
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # The product coverage gate intentionally measures only `src`. Keep the
      # opt-in campaign executor on its own deterministic floor so its process
      # and evidence lifecycle cannot regress unnoticed.
      - id: real-validation-coverage
        name: real-validation-coverage
        entry: >-
          uv run --locked --no-sync pytest -q
          tests/tooling/test_cotahist_oracle.py
          tests/tooling/test_file_digests.py
          tests/tooling/test_cvm_archive_oracle.py
          tests/tooling/test_cvm_catalog.py
          tests/tooling/test_real_validation.py
          tests/tooling/test_real_validation_b3.py
          tests/tooling/test_real_validation_cases.py
          tests/tooling/test_real_validation_cvm.py
          tests/tooling/test_real_validation_cvm_integration.py
          tests/tooling/test_real_validation_matrix.py
          tests/tooling/test_real_validation_process.py
          tests/tooling/test_real_validation_report.py
          tests/tooling/test_real_validation_resume.py
          tests/tooling/test_real_validation_runner.py
          tests/tooling/test_real_validation_types.py
          tests/tooling/test_real_validation_utils.py
          --cov=scripts.cotahist_oracle
          --cov=scripts.file_digests
          --cov=scripts.cvm_archive_oracle
          --cov=scripts.cvm_catalog
          --cov=scripts.real_validation
          --cov=scripts.real_validation_b3
          --cov=scripts.real_validation_cases
          --cov=scripts.real_validation_cvm
          --cov=scripts.real_validation_matrix
          --cov=scripts.real_validation_report
          --cov=scripts.real_validation_resume
          --cov=scripts.real_validation_runner
          --cov=scripts.real_validation_types
          --cov=scripts.real_validation_utils
          --cov-report=term-missing
          --cov-fail-under=85
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pip-audit
        name: pip-audit
        # Audit the uv-locked graph, including dev dependencies, without
        # assuming the local environment has been synchronized.
        entry: >-
          uv run --locked --no-sync python
          scripts/audit_locked_dependencies.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
