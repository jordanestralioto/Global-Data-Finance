[project]
name = "globaldatafinance"
dynamic = ["version"]
description = "Library for extracting, normalizing and persisting Brazilian CVM regulatory filings and B3 historical market quotes in Parquet."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Jordan Estralioto", email = "estraliotojordan@gmail.com" }
]
keywords = ["finance", "financial-data", "market-data", "fundamentals", "historical-quotes", "parquet", "b3", "cvm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries"
]

requires-python = ">=3.12,<4.0"

dependencies = [
    "pydantic-settings>=2.11.0,<3.0.0",
    "pyarrow>=23.0.1,<24.0.0",
    "httpx[http2]>=0.28.1,<0.29.0",
    "psutil>=5.9.0,<7.0.0",
    "pandas>=2.3.3,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/jordanestralioto/Global-Data-Finance"
Repository = "https://github.com/jordanestralioto/Global-Data-Finance"
Documentation = "https://jordanestralioto.github.io/Global-Data-Finance/"
"Bug Tracker" = "https://github.com/jordanestralioto/Global-Data-Finance/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0,<5",
    "pytest>=8.4.2",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.22",
    "mkdocs-static-i18n>=1.2.0",
    "pytest-asyncio>=1.3.0",
    "ipykernel>=7.1.0",
    "pip-audit>=2.9.0",
    "mdformat==1.0.0",
    "mdformat-gfm==1.0.0",
    "requests>=2.32.5",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.0.0,<7.0.0",
    "import-linter>=2.0",
    "grimp>=3.15,<4",
    # Also needed as CLIs: the workflows call `uv run ruff` and
    # `uv run detect-secrets-hook` directly, and pre-commit's isolated hook
    # venvs do not put anything on the project environment. Keep these ranges
    # matching the `rev:` pins in .pre-commit-config.yaml so the CLI and the
    # hook never disagree about what is a violation.
    "ruff>=0.16.2,<0.17",
    "detect-secrets>=1.5.0,<2",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>.+)$"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/globaldatafinance"]

[tool.hatch.build]
exclude = [
    "**/cookies_*.py",
    "**/__pycache__",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/globaldatafinance",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["pandas", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
# These used to live as [coverage:*] sections in pytest.ini, where coverage.py
# never read them -- it only looks at .coveragerc, setup.cfg, tox.ini and this
# file. That is why every caller had to repeat `--cov=src --cov-fail-under=85`
# on the command line.
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "*/.venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 85

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
# Blue style: 79 characters line length
line-length = 79

[tool.ruff.lint]
# Curated base rule set for a distribution-shaped library. The explicit
# ruff-policy gate adds the opt-in docstring and security profiles so each
# profile has a visible, reviewable scope.
select = [
  "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF",
  "PTH",    # Use pathlib (flake8-use-pathlib)
  "ARG",    # Unused arguments (flake8-unused-arguments)
  "LOG",    # Logging best practices (flake8-logging)
  "C901",   # McCabe cyclomatic complexity
  "BLE001", # No blind exception catches
  "TRY203", # No useless try/except reraises
  "TRY400", # Preserve traceback logging in exception handlers
  "TRY401", # Do not repeat logged exception objects
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["globaldatafinance"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# The single subprocess boundary is reviewed and tested as an internal
# adapter. Its resolved executable and `shell=False` contract make S603 the
# only legitimate file-scoped exception in this repository.
"scripts/process_runner.py" = ["S603"]

[tool.ruff.format]
# Blue style: Single quotes
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
]

[tool.uv.sources]
globaldatafinance = { workspace = true }

# ---------------------------------------------------------------------------
# Import-time architecture contracts (import-linter)
# ---------------------------------------------------------------------------
# Ruff and mypy validate code inside a module; these contracts validate the
# shape of the import graph between modules -- circular imports and layering
# violations that no linter here would otherwise catch.
[tool.importlinter]
root_package = "globaldatafinance"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "globaldatafinance.application : globaldatafinance.brazil",
    "globaldatafinance.macro_infra",
    "globaldatafinance.core",
    "globaldatafinance.macro_exceptions",
]

# NOTE: cycle detection is NOT expressible as an import-linter contract -- a
# layers contract cannot see a submodule importing its own package root. That
# check lives in scripts/check-import-cycles.py.
