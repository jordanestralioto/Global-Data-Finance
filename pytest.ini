[pytest]
# Configuração do pytest

# Diretórios de teste
testpaths = tests
pythonpath = .

# Padrão de arquivos de teste
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opções padrão
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --maxfail=1
    --strict-config
    -ra
    -m "not slow and not real_data and not perf"

# Marcadores customizados
markers =
    unit: Tier primário para comportamento isolado com fakes, stubs ou colaboradores locais puros.
    integration: Tier primário para fluxos com múltiplos componentes reais de produção e filesystem local determinístico.
    real_data: Qualificador para COTAHIST local pertencente ao chamador; exige integration e é sempre opt-in.
    slow: Qualificador ortogonal para testes pesados ou sensíveis a tempo; excluído da execução padrão.
    asyncio: Qualificador ortogonal para testes assíncronos; não define o tier primário.
    perf: Tier primário exclusivo para benchmarks e medições de recursos; sempre opt-in.

# Configuração de asyncio para pytest-asyncio
# asyncio_mode = auto

# Coverage settings are NOT configured here. coverage.py only reads
# .coveragerc, setup.cfg, tox.ini and pyproject.toml -- never pytest.ini --
# so [coverage:*] sections in this file are silently ignored. They live in
# [tool.coverage.*] in pyproject.toml.
