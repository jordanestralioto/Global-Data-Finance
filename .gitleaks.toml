title = "GlobalDataFinance gitleaks policy"

[extend]
useDefault = true

# Every exception names the rule it silences in `targetRules`. Gitleaks then
# still reads the whole file and drops only the matching finding. Never add an
# allowlist without `targetRules`: a global one is applied by `gitleaks dir`
# (the CI scan) to `paths` alone, so it skips every matching file before
# `condition` or `regexes` are evaluated.

[[allowlists]]
description = "Audited detect-secrets fingerprints for benchmark digests"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^\.secrets\.baseline$''']
regexTarget = "line"
regexes = ['''(?m)^\s*"hashed_secret":\s*"[0-9a-f]{40}",?\s*$''']
