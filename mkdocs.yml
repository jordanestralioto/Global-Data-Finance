---
# Project Information
site_name: Global-Data-Finance
site_author: Jordan Estralioto
site_description: >-
  Biblioteca Python para extração e processamento de dados financeiros globais
site_url: https://jordanestralioto.github.io/Global-Data-Finance/
# Repository
repo_name: jordanestralioto/Global-Data-Finance
repo_url: https://github.com/jordanestralioto/Global-Data-Finance
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2026 Jordan Estralioto

# Configuration
theme:
  name: material
  language: pt
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Mudar para tema escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Mudar para tema claro
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - header.autohide
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
  navigation_depth: 4
  icon:
    repo: fontawesome/brands/github

extra:
  alternate:
    - name: Português
      link: /
      lang: pt
    - name: English
      link: /en/
      lang: en
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jordanestralioto/Global-Data-Finance
      name: Código-fonte
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/globaldatafinance/
      name: PyPI
    - icon: material/email
      link: mailto:estraliotojordan@gmail.com
      name: Contato

extra_css:
  - https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap
  - assets/stylesheets/custom.css

extra_javascript:
  - assets/javascripts/wide-toggle.js

plugins:
  - search:
      lang: pt
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: pt
          name: Português
          default: true
          build: true
        - locale: en
          name: English
          default: false
          build: true
          nav_translations:
            Início: Home
            Guia do Usuário: User Guide
            Guia do Desenvolvedor: Developer Guide
            Referência Técnica: Technical Reference
            Instalação: Installation
            Início Rápido: Quickstart
            Documentos CVM: CVM Documents
            Cotações Históricas B3: B3 Historical Quotes
            Exemplos Práticos: Practical Examples
            Boas práticas B3: B3 Operational Practices
            Migração major: Major Migration
            Migração de infraestrutura: Infrastructure Clean Cut Migration
            Arquitetura: Architecture
            Referência da API: API Reference
            Como Contribuir: Contributing
            Testes: Testing
            Uso Avançado: Advanced Usage
            Sistema de Logging: Logging System
            Monitoramento de Recursos: Resource Monitoring
            Estratégia de Retry: Retry Strategy
            Decisões Técnicas: Technical Decisions
            Níveis de Execução de Testes: Test Execution Tiers
            Campanha Real Auditável: Auditable Real-Data Campaign
            Limites ZIP e Destinos UNC: ZIP Limits and UNC Destinations
            Commit CVM Tolerante a Falhas: Failure-Atomic CVM Batch Commit
            Cutover PyArrow e Integridade: PyArrow and Integrity Cutover
            ? >-
              Corte limpo da infraestrutura compartilhada
            : Shared Infrastructure Clean Cut
            API CVM: CVM API
            API B3: B3 API
            Exceções: Exceptions

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
      linenums: true
      use_pygments: true
  - def_list
  - fenced_code
  - footnotes
  - meta
  - nl2br
  - sane_lists
  - smarty
  - tables
  - toc:
      permalink: true
      permalink_title: Link para esta seção
      toc_depth: 3
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.magiclink

# Navigation
nav:
  - Início: index.md
  - Guia do Usuário:
      - Instalação: user-guide/installation.md
      - Início Rápido: user-guide/quickstart.md
      - Documentos CVM: user-guide/cvm-docs.md
      - Cotações Históricas B3: user-guide/b3-docs.md
      - Boas práticas B3: user-guide/b3-operations.md
      - Exemplos Práticos: user-guide/examples.md
      - FAQ: user-guide/faq.md
      - Migração major: user-guide/migration-pyarrow-integrity.md
      - Migração de infraestrutura: user-guide/migration-infrastructure-clean-cut.md
  - Guia do Desenvolvedor:
      - Arquitetura: dev-guide/architecture.md
      - Referência da API: dev-guide/api-reference.md
      - Como Contribuir: dev-guide/contributing.md
      - Testes: dev-guide/testing.md
      - Benchmarks: dev-guide/benchmarks.md
      - Decisões Técnicas:
          - Níveis de Execução de Testes: decisions/test-execution-tiers.md
          - Campanha Real Auditável: decisions/real-validation-campaign.md
          - Limites ZIP e Destinos UNC: decisions/archive-safety-and-unc.md
          - Commit CVM Tolerante a Falhas: decisions/cvm-failure-atomic-batch-commit.md
          - Cutover PyArrow e Integridade: decisions/pyarrow-ingestion-integrity-cutover.md
          - Corte limpo da infraestrutura compartilhada: decisions/shared-infrastructure-clean-cut.md
      - Uso Avançado: dev-guide/advanced-usage.md
      - Sistema de Logging: dev-guide/logging-system.md
      - Monitoramento de Recursos: dev-guide/resource-monitoring.md
      - Estratégia de Retry: dev-guide/retry-strategy.md
  - Referência Técnica:
      - API CVM: reference/cvm-api.md
      - API B3: reference/b3-api.md
      - Exceções: reference/exceptions.md
